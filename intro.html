<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめての方へ｜うたがえし</title>
<meta name="description" content="毎日の小さな景色を見て、浮かんだことを自分の言葉で残す場所。">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/ui-next.css">
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div class="app">

  <!--
    はじめての方へ `/intro`。
    ここだけは visual-card を使わない。実物のカードで作り直したことも
    あったが、めくっても同じ画面に見えて意味が通らなかったので戻した。
    1ページ1メッセージの、小さな本のまま。
    初回訪問者をここへ送る導線は持たない（ホームから始めてよい）。
  -->
  <main class="page intro-mock">

    <div data-app-header="overlay" data-header-boundary=".intro-slider"></div>

    <section class="intro-slider" aria-label="うたがえしについて">
      <div class="intro-slider-viewport" data-intro>

        <article class="intro-slide intro-card-active" data-intro-page
                 style="background-image:url('assets/scenes/10/10_street_01.webp')">
          <div class="intro-slide-copy">
            <p class="intro-slide-kicker">はじめての方へ</p>
            <h1>千年前の歌人と、<br>同じ景色を見る。</h1>
            <p class="intro-slide-desc">うたがえしは、毎日の小さな景色に、今の自分の言葉を残す場所です。</p>
          </div>
        </article>

        <article class="intro-slide" data-intro-page hidden
                 style="background-image:url('assets/scenes/10/10_park_01.webp')">
          <div class="intro-slide-copy">
            <p class="intro-slide-kicker">景色を見る</p>
            <p class="intro-slide-main">その日ひとつの、<br>小さな景色が届きます。</p>
            <p class="intro-slide-desc">まずは見るだけで大丈夫。何か浮かんだら、そのまま次へ。</p>
          </div>
        </article>

        <article class="intro-slide" data-intro-page hidden
                 style="background-image:url('assets/scenes/10/10_room_01.webp')">
          <div class="intro-slide-copy">
            <p class="intro-slide-kicker">言葉を残す</p>
            <p class="intro-slide-main">短歌にしなくていい。</p>
            <p class="intro-slide-desc">ひとことでも、まとまっていなくてもいい。浮かんだことを、そのまま残せます。</p>
          </div>
        </article>

        <article class="intro-slide" data-intro-page hidden
                 style="background-image:url('assets/scenes/10/10_night_sky_01.webp')">
          <div class="intro-slide-copy">
            <p class="intro-slide-kicker">同じ景色の言葉を読む</p>
            <p class="intro-slide-main">今の誰かの言葉に、<br>千年前の言葉も混ざる。</p>
            <p class="intro-slide-desc">同じ景色を見た人たちの言葉を、1枚ずつめくって読めます。</p>
            <a class="intro-slide-cta" href="index.html">今日の景色を見る</a>
          </div>
        </article>
      </div>

      <div class="intro-slider-nav">
        <button type="button" data-intro-prev disabled aria-label="前のページ">←</button>
        <span data-intro-indicator>1 / 4</span>
        <button type="button" data-intro-next aria-label="次のページ">→</button>
      </div>
      <p class="intro-swipe-hint">左右にスワイプしてめくる</p>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
</body>
</html>
