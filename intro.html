<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめての方へ｜うたがえし</title>
<meta name="description" content="毎日の小さな景色を見て、浮かんだことを自分の言葉で残す場所。">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/ui-next.css">
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div class="app">

  <!--
    はじめての方へ `/intro`。
    ここだけは visual-card を使わない。実物のカードで作り直したことも
    あったが、めくっても同じ画面に見えて意味が通らなかったので戻した。
    1ページ1メッセージの、小さな本のまま。
    初回訪問者をここへ送る導線は持たない（ホームから始めてよい）。
  -->
  <main class="page intro-mock">

    <div data-app-header="overlay" data-header-boundary=".intro-hero"></div>

    <section class="intro-hero" aria-labelledby="intro-title"
             style="background-image:url('assets/scenes/10/10_street_01.webp')">
      <div class="intro-hero-copy">
        <p class="intro-kicker">はじめての方へ</p>
        <h1 id="intro-title">千年前の歌人と、<br>同じ景色を見る。</h1>
        <p>今日の景色を見て、浮かんだことをひとつ残す。<br>その景色には、今の誰かと昔の誰かの言葉も残っています。</p>
      </div>
    </section>

    <section class="intro-flow" aria-label="うたがえしの使い方">
      <div class="intro-flow-lead">
        <span>うたがえしで、すること</span>
      </div>

      <article class="intro-flow-item">
        <span class="intro-flow-no">01</span>
        <div>
          <h2>景色を見る</h2>
          <p>その日ひとつの、小さな景色が届きます。</p>
        </div>
      </article>

      <article class="intro-flow-item">
        <span class="intro-flow-no">02</span>
        <div>
          <h2>浮かんだことを残す</h2>
          <p>短歌にする必要はありません。ひとことでも、書かない日でも大丈夫です。</p>
        </div>
      </article>

      <article class="intro-flow-item">
        <span class="intro-flow-no">03</span>
        <div>
          <h2>同じ景色の言葉をめくる</h2>
          <p>今の誰かの言葉に混ざって、千年前の人が残した言葉も現れます。</p>
        </div>
      </article>

      <a class="intro-start" href="index.html">
        <span>今日の景色を見る</span>
        <span aria-hidden="true">→</span>
      </a>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
</body>
</html>
