<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめての方へ｜うたがえし</title>
<meta name="description" content="毎日の小さな景色を見て、浮かんだことを自分の言葉で残す場所。">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/ui-next.css">
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div class="app">

  <!--
    はじめての方へ `/intro`。
    ここだけは visual-card を使わない。実物のカードで作り直したことも
    あったが、めくっても同じ画面に見えて意味が通らなかったので戻した。
    1ページ1メッセージの、小さな本のまま。
    初回訪問者をここへ送る導線は持たない（ホームから始めてよい）。
  -->
  <main class="page intro-mock">

    <div data-app-header="paper" data-header-tools="none"></div>

    <section class="intro-book" aria-label="うたがえしについて">
      <div class="deck-viewport intro-deck" data-intro>

        <article class="deck-card intro-card-active" data-intro-page>
          <div class="intro-page">
            <div class="intro-page-number" aria-hidden="true">01</div>
            <div class="intro-page-copy">
              <p class="intro-eyebrow">うたがえし</p>
              <h1 class="intro-title">今日の景色から、<br>言葉をひとつ。</h1>
              <p class="intro-sub">毎日の小さな景色を見て、浮かんだことを残す場所です。</p>
            </div>
          </div>
        </article>

        <article class="deck-card" data-intro-page hidden>
          <div class="intro-page">
            <div class="intro-page-number" aria-hidden="true">02</div>
            <div class="intro-page-copy">
              <p class="intro-eyebrow">景色を見る</p>
              <p class="intro-scene">風が少し軽い<br>帰り道の影が<br>いつもより長い</p>
              <p class="intro-sub">その日に出会った小さな景色が、ひとつ届きます。</p>
            </div>
          </div>
        </article>

        <article class="deck-card" data-intro-page hidden>
          <div class="intro-page">
            <div class="intro-page-number" aria-hidden="true">03</div>
            <div class="intro-page-copy">
              <p class="intro-eyebrow">千年前の言葉</p>
              <p class="intro-poem">ちはやぶる
神代もきかず
龍田川
からくれなゐに
水くくるとは</p>
              <p class="intro-poem-meta">在原業平朝臣『百人一首』十七番</p>
              <p class="intro-sub">同じ景色について残された言葉として、そっと混ざります。</p>
            </div>
          </div>
        </article>

        <article class="deck-card" data-intro-page hidden>
          <div class="intro-page">
            <div class="intro-page-number" aria-hidden="true">04</div>
            <div class="intro-page-copy">
              <p class="intro-eyebrow">残す</p>
              <p class="intro-title">短歌にしなくていい。</p>
              <p class="intro-sub">浮かんだことを、そのままひとこと。<br>読むだけの日があっても大丈夫です。</p>
              <button class="intro-cta" type="button" data-href="index.html">今日の景色を見る</button>
            </div>
          </div>
        </article>
      </div>

      <div class="intro-book-nav">
        <button type="button" data-intro-prev disabled aria-label="前のページ">←</button>
        <span data-intro-indicator>1 / 4</span>
        <button type="button" data-intro-next aria-label="次のページ">→</button>
      </div>
      <p class="intro-swipe-hint">左右にスワイプしてめくる</p>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
</body>
</html>
