<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>返し帳｜うたがえし</title>
<meta name="description" content="自分の言葉を読み返す場所。">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/ui-next.css">
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div class="app">

  <!--
    返し帳 `/mypage`。ホームと並ぶ主役。
    投稿履歴を見る場所ではなく、過去の自分の言葉から、その日の景色や
    周辺の記憶を思い出す場所。だからこの画面からは他ページへ飛ばさない
    （目次の行を押しても遷移せず、上のカードが切り替わるだけ）。

    ページ番号は古い順に固定（あとから投稿しても既存の番号が変わらない）、
    目次は新しい日付から降順。付与順と表示順が逆なので取り違えないこと。
  -->
  <main class="book-mock">

    <header class="home-mock-top book-shell-header">
      <div class="book-shell-top">
        <div class="brand-wrap">
          <a class="brand" href="index.html">うたがえし</a>
        </div>
        <div class="header-tools">
          <a class="header-avatar-link" href="profile.html" aria-label="プロフィール">
            <span class="header-avatar is-blank">ゆ</span>
          </a>
          <button class="home-menu" type="button" aria-label="メニュー" aria-expanded="false" data-menu>
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>

      <div class="book-shell-title">ゆきの返し帳</div>

      <div class="book-tabs" role="tablist">
        <button class="book-tab active" type="button" role="tab" aria-selected="true" data-book-tab="mine">残した言葉</button>
        <button class="book-tab" type="button" role="tab" aria-selected="false" data-book-tab="liked">心に残った言葉</button>
      </div>
    </header>

    <!-- ===== 残した言葉 ===== -->
    <div class="book-pane" data-book-pane="mine" data-book-word-label="あなたの言葉">

      <div data-book-card class="book-page-card">
        <article class="vcard vcard--mine">
          <div class="book-page-mark" aria-hidden="true">
            <strong data-book-page-mark>06</strong>
            <span data-book-page-date>2026.10.05</span>
          </div>
          <div class="vcard-label"></div>
          <div class="vcard-chip">あなたの言葉</div>
          <div class="vcard-body"><p class="vcard-text vcard-text--xl"></p></div>
          <div class="vcard-bottom">
            <span><button class="toggle-link" type="button" data-book-toggle>この日の景色を見る</button></span>
            <span data-book-meta-right></span>
          </div>
        </article>
      </div>

      <div class="pager">
        <button class="pager-btn" type="button" data-book-prev>←</button>
        <div class="counter">
          <strong data-book-counter>6 / 6</strong>
          <span>返し帳</span>
        </div>
        <button class="pager-btn right" type="button" data-book-next>→</button>
      </div>

      <div class="swipe-note">左右にスワイプしてもめくれます</div>

      <section class="toc">
        <div class="toc-head">
          <h2>目次</h2>
          <span>気になる日から開く</span>
        </div>

        <div class="toc-list grouped-toc">
          <div>
            <section class="toc-month current-month expanded">
              <div class="toc-month-head static">
                <span class="toc-month-name">10月</span>
                <span class="toc-month-count">3の言葉</span>
              </div>
              <div class="toc-month-body open">
                <button class="toc-row" type="button" data-book-open data-page="6"
                        data-date="10月5日"
                        data-image="assets/scenes/10/10_night_sky_01.webp"
                        data-word="寒いと言いながら、もう一度だけ空を見た。"
                        data-scene="月がやけに白い&#10;上着を取りに&#10;一度だけ戻る"
                        data-meta-right="届いた反応 5">
                  <span class="toc-page">6</span>
                  <span class="toc-date">10月5日</span>
                  <span class="toc-text">寒いと言いながら、もう一度だけ空を見た。</span>
                  <span class="toc-arrow">›</span>
                </button>
                <button class="toc-row" type="button" data-book-open data-page="5"
                        data-date="10月3日"
                        data-image="assets/scenes/10/10_park_01.webp"
                        data-word="どんぐりを踏まないように歩いていたら、遅刻しそうになった。"
                        data-scene="ベンチの上に&#10;どんぐりがひとつ&#10;誰も座らない"
                        data-meta-right="届いた反応 2">
                  <span class="toc-page">5</span>
                  <span class="toc-date">10月3日</span>
                  <span class="toc-text">どんぐりを踏まないように歩いていたら、遅刻しそうになった。</span>
                  <span class="toc-arrow">›</span>
                </button>
                <button class="toc-row" type="button" data-book-open data-page="4"
                        data-date="10月1日"
                        data-image="assets/scenes/10/10_transit_01.webp"
                        data-word="上着の人が増えると、自分だけ取り残された気がする。"
                        data-scene="乗り換えのホーム&#10;上着の人が&#10;少しだけ増えた"
                        data-meta-right="届いた反応 8">
                  <span class="toc-page">4</span>
                  <span class="toc-date">10月1日</span>
                  <span class="toc-text">上着の人が増えると、自分だけ取り残された気がする。</span>
                  <span class="toc-arrow">›</span>
                </button>
              </div>
            </section>

            <section class="toc-month">
              <button class="toc-month-head" type="button" aria-expanded="false">
                <span class="toc-month-name">9月</span>
                <span class="toc-month-count">3の言葉</span>
                <span class="toc-month-arrow">›</span>
              </button>
              <div class="toc-month-body">
                <button class="toc-row" type="button" data-book-open data-page="3"
                        data-date="9月28日"
                        data-image="assets/scenes/09/09_evening_01.webp"
                        data-word="まだ明るいという理由だけで、知らない角を曲がった。"
                        data-scene="帰る時間なのに&#10;まだ明るくて&#10;少し遠回りした"
                        data-meta-right="届いた反応 4">
                  <span class="toc-page">3</span>
                  <span class="toc-date">9月28日</span>
                  <span class="toc-text">まだ明るいという理由だけで、知らない角を曲がった。</span>
                  <span class="toc-arrow">›</span>
                </button>
                <button class="toc-row" type="button" data-book-open data-page="2"
                        data-date="9月12日"
                        data-image="assets/scenes/09/09_night_sky_01.webp"
                        data-word="ゴミ袋を持ったまま、しばらく空を見ていた。"
                        data-scene="ゴミを出しに出て&#10;空を見てから&#10;部屋へ戻った"
                        data-meta-right="届いた反応 1">
                  <span class="toc-page">2</span>
                  <span class="toc-date">9月12日</span>
                  <span class="toc-text">ゴミ袋を持ったまま、しばらく空を見ていた。</span>
                  <span class="toc-arrow">›</span>
                </button>
                <button class="toc-row" type="button" data-book-open data-page="1"
                        data-date="9月5日"
                        data-image="assets/scenes/09/09_street_01.webp"
                        data-word="日かげを選んで歩くのが、いつのまにか癖になっている。"
                        data-scene="日なたを避けて&#10;道の左ばかり&#10;歩いてしまう"
                        data-meta-right="届いた反応 3">
                  <span class="toc-page">1</span>
                  <span class="toc-date">9月5日</span>
                  <span class="toc-text">日かげを選んで歩くのが、いつのまにか癖になっている。</span>
                  <span class="toc-arrow">›</span>
                </button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </div>

    <!-- ===== 心に残った言葉 ===== -->
    <!--
      千年前の言葉は混ぜない（意図的な非対称）。
      ホームのデッキでは 自分 / 他人 / 千年前 が同じ景色から出た言葉として
      混ざるが、返し帳は自分が過ごした日の記憶を拾い直す場所なので、
      ここに並ぶのは自分の言葉と、自分が反応して残した他の人の言葉だけ。
    -->
    <div class="book-pane" data-book-pane="liked" data-book-word-label="心に残った言葉" hidden>

      <div data-book-card class="book-page-card">
        <article class="vcard vcard--mine">
          <div class="book-page-mark" aria-hidden="true">
            <strong data-book-page-mark>03</strong>
            <span data-book-page-date>2026.10.05</span>
          </div>
          <div class="vcard-label"></div>
          <div class="vcard-chip">心に残った言葉</div>
          <div class="vcard-body"><p class="vcard-text vcard-text--xl"></p></div>
          <div class="vcard-bottom">
            <span><button class="toggle-link" type="button" data-book-toggle>この日の景色を見る</button></span>
            <span data-book-meta-right></span>
          </div>
        </article>
      </div>

      <div class="pager">
        <button class="pager-btn" type="button" data-book-prev>←</button>
        <div class="counter">
          <strong data-book-counter>3 / 3</strong>
          <span>返し帳</span>
        </div>
        <button class="pager-btn right" type="button" data-book-next>→</button>
      </div>

      <div class="swipe-note">左右にスワイプしてもめくれます</div>

      <section class="toc">
        <div class="toc-head">
          <h2>目次</h2>
          <span>気になる日から開く</span>
        </div>

        <div class="toc-list grouped-toc">
          <div>
            <section class="toc-month current-month expanded">
              <div class="toc-month-head static">
                <span class="toc-month-name">10月</span>
                <span class="toc-month-count">2の言葉</span>
              </div>
              <div class="toc-month-body open">
                <button class="toc-row" type="button" data-book-open data-page="3"
                        data-date="10月5日"
                        data-image="assets/scenes/10/10_night_sky_01.webp"
                        data-word="きれいだね、と言う相手がいない夜も、きれいだった。"
                        data-scene="月がやけに白い&#10;上着を取りに&#10;一度だけ戻る"
                        data-meta-right="心に残した">
                  <span class="toc-page">3</span>
                  <span class="toc-date">10月5日</span>
                  <span class="toc-text">きれいだね、と言う相手がいない夜も、きれいだった。</span>
                  <span class="toc-arrow">›</span>
                </button>
                <button class="toc-row" type="button" data-book-open data-page="2"
                        data-date="10月1日"
                        data-image="assets/scenes/10/10_transit_01.webp"
                        data-word="同じ電車の同じ位置に、毎朝ちがう人が立っている。"
                        data-scene="乗り換えのホーム&#10;上着の人が&#10;少しだけ増えた"
                        data-meta-right="心に残した">
                  <span class="toc-page">2</span>
                  <span class="toc-date">10月1日</span>
                  <span class="toc-text">同じ電車の同じ位置に、毎朝ちがう人が立っている。</span>
                  <span class="toc-arrow">›</span>
                </button>
              </div>
            </section>

            <section class="toc-month">
              <button class="toc-month-head" type="button" aria-expanded="false">
                <span class="toc-month-name">9月</span>
                <span class="toc-month-count">1の言葉</span>
                <span class="toc-month-arrow">›</span>
              </button>
              <div class="toc-month-body">
                <button class="toc-row" type="button" data-book-open data-page="1"
                        data-date="9月12日"
                        data-image="assets/scenes/09/09_night_sky_01.webp"
                        data-word="見上げるために外へ出たのではないのに、見上げてしまう。"
                        data-scene="ゴミを出しに出て&#10;空を見てから&#10;部屋へ戻った"
                        data-meta-right="心に残した">
                  <span class="toc-page">1</span>
                  <span class="toc-date">9月12日</span>
                  <span class="toc-text">見上げるために外へ出たのではないのに、見上げてしまう。</span>
                  <span class="toc-arrow">›</span>
                </button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottomnav">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      ホーム
    </a>
    <a class="nav-item" href="scenes.html">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
      これまで
    </a>
    <a class="nav-item on" href="mypage.html">
      <svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 3v18"/></svg>
      返し帳
    </a>
  </nav>
</div>

<div class="header-menu-panel" role="menu" hidden>
  <a class="header-menu-item" href="profile.html" role="menuitem">プロフィール</a>
  <a class="header-menu-item" href="account.html" role="menuitem">アカウント設定</a>
  <a class="header-menu-item" href="mypage-list.html" role="menuitem">言葉を整える・削除する</a>
  <a class="header-menu-item" href="intro.html" role="menuitem">はじめての方へ</a>
  <button class="header-menu-item header-menu-item-button" type="button" role="menuitem">ログアウト</button>
</div>

<script src="assets/app.js"></script>
</body>
</html>
