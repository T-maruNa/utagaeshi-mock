<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめる｜うたがえし</title>
<meta name="description" content="うたがえしをはじめる。ログイン・新規登録。">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">

  <main class="auth">

    <a class="logo" href="index.html" style="font-size:24px;">うたがえし<small>UTAGAESHI</small></a>

    <div style="height:36px;"></div>

    <h1 class="lead">昔のうたに、<br>今の言葉で返す。</h1>
    <p class="sub">読むだけならログインは要りません。返す・リアクション・返し帳を使うときにログインしてください。</p>

    <!-- Googleログイン（おすすめ）※モックではタップでログイン状態になります -->
    <button class="btn btn-google" type="button" data-do-login>
      <span aria-hidden="true" style="font-weight:700;">G</span>
      Googleではじめる
    </button>

    <div class="divider">または メールで</div>

    <input class="input" type="email" placeholder="メールアドレス" autocomplete="email">
    <input class="input" type="password" placeholder="パスワード" autocomplete="current-password">

    <button class="btn btn-primary" type="button" data-do-login>ログイン / 新規登録</button>

    <p class="center" style="margin-top:16px;">
      <a href="index.html" class="muted" style="font-size:13px;">ログインせずに読む ›</a>
    </p>

    <p class="legal">
      続行すると、
      <a href="#">利用規約</a>・<a href="#">プライバシーポリシー</a>・<a href="#">投稿ガイドライン</a>
      に同意したものとみなされます。<br>
      本サービスは著作権切れの古典短歌のみを使用しています。
    </p>

  </main>

</div>
<script src="assets/app.js"></script>
</body>
</html>
