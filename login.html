<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ログイン｜うたがえし</title>
<meta name="description" content="ログインして、あなたの返し帳を開く。">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/ui-next.css">
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div class="app">

  <!--
    ログイン `/login`。体験の主役ではないので、作りは変えず
    パレットとタイポだけ刷新に追従させる。読むだけならログインは要らない。
  -->
  <header class="header auth-header">
    <a class="header-back" href="index.html">‹ ホーム</a>
    <div class="header-date"><b>ログイン</b></div>
  </header>

  <main class="page auth auth-mock">
    <p class="lead">ログイン</p>
    <p class="sub">おかえりなさい。ログインして、あなたの返し帳を開きます。</p>

    <p class="method-label">お持ちのアカウントで続ける</p>
    <div class="form-stack">
      <button class="btn btn-google btn-block" type="button">Googleで続ける</button>
    </div>

    <div class="divider">または</div>

    <p class="method-label">メールアドレスでログインする</p>
    <form class="form-stack">
      <input class="input" type="email" name="email" placeholder="メールアドレス" autocomplete="email" required>
      <input class="input" type="password" name="password" placeholder="パスワード" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block" type="button">ログインする</button>
    </form>

    <!-- 思い出せないと気づくのはここなので、ページの下まで探させない -->
    <p class="auth-forgot"><a href="login.html">パスワードを忘れた方はこちら</a></p>

    <p class="empty-note">はじめての方は <a href="signup.html">アカウントをつくる</a></p>

    <p class="legal-consent">
      <a href="legal.html">利用規約</a>　<a href="legal.html">プライバシーポリシー</a>
    </p>

    <div class="spacer"></div>
  </main>
</div>

<script src="assets/app.js"></script>
</body>
</html>
