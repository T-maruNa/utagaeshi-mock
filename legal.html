<div class="app">

  <!--
    利用規約 `/terms` / プライバシーポリシー `/privacy` の見え方。
    この2ページは読ませるための文書で、体験の一部ではないので、
    作りは増やさず、他の下層ページと同じ .scenes-mock の上に
    読みやすい本文の組みだけ足す。

    ■ モックが持つのは「見え方」だけ
    本文の正本は実装リポジトリ（utagaeshi の /terms・/privacy）にある。
    条文をこちらで書くと、どちらが本当の文か分からなくなるので置かない。
  -->
  <header class="header">
    <a class="header-back" href="index.html">‹ ホーム</a>
    <div class="header-date"><b>利用規約</b></div>
  </header>

  <main class="scenes-mock legal-mock">
    <div class="book-title">
      <h1>利用規約</h1>
      <span>うたがえしを使うときの約束です。</span>
    </div>

    <article class="legal-body">
      <p>本文はダミーです。実際の条文は実装リポジトリ側にあります。</p>

      <section class="legal-section">
        <h2>このサービスについて</h2>
        <p>節の見出しと本文の組み方だけを示しています。番号は振らず、並び順で決まるようにします。</p>
      </section>

      <section class="legal-section">
        <h2>残した言葉の扱い</h2>
        <p>箇条書きが入る場合の見え方です。</p>
        <ul>
          <li>景色と言葉は、他の人にも見えます</li>
          <li>消した言葉の扱い</li>
          <li>退会したときの扱い</li>
        </ul>
      </section>

      <section class="legal-section">
        <h2>お問い合わせ</h2>
        <dl class="legal-contact">
          <div>
            <dt>運営者</dt>
            <dd>（実装側で設定）</dd>
          </div>
          <div>
            <dt>問い合わせ</dt>
            <dd>（実装側で設定）</dd>
          </div>
          <div>
            <dt>住所</dt>
            <dd>ご請求があった場合に、遅滞なくご回答します。</dd>
          </div>
        </dl>
      </section>
    </article>

    <p class="legal-revised">最終改定日：（実装側で設定）</p>
  </main>
