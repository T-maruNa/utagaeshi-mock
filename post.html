<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>返す｜うたがえし</title>
<meta name="description" content="今の自分の言葉で、昔のうたに返す。">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">

  <header class="header">
    <a class="header-back" href="index.html">‹ お題にもどる</a>
    <div class="header-date"><b>返す</b></div>
  </header>

  <main class="page">

    <!-- お題の短歌（コンパクト表示） -->
    <section class="prompt-mini">
      <div class="label">今日のお題</div>
      <div class="text">春過ぎて 夏来にけらし 白妙の 衣ほすてふ 天の香具山</div>
      <div class="meta">持統天皇／百人一首・二番</div>
    </section>

    <!-- AI解説は折りたたみ -->
    <details class="fold">
      <summary>
        <span class="ai-badge">AI</span> 読み解きのヒントを見る
        <span class="chev">⌄</span>
      </summary>
      <div class="fold-body">
        <p class="ai-body">春がいつのまにか過ぎて、夏が来たみたいですね。天の香具山に真っ白な衣が干してある——そんな景色から季節の移り変わりを感じている一首に読めます。</p>
        <p class="ai-nuance">「気づいたら夏だった」という小さな驚きと、まぶしい白へのやわらかな安心感がありそうです。</p>
      </div>
    </details>

    <!-- AI投稿例（タップで下書きに入る） -->
    <p class="section-label">例をヒントに</p>
    <div class="examples">
      <button class="example" type="button" data-text="気づいたら夏だった。今年もあの人と、海に行けるかな。">
        <span class="n">1</span>
        <span>気づいたら夏だった。今年もあの人と、海に行けるかな。</span>
        <span class="use">下書きに ›</span>
      </button>
      <button class="example" type="button" data-text="ベランダの白いシャツがまぶしい。季節はちゃんと進んでる。">
        <span class="n">2</span>
        <span>ベランダの白いシャツがまぶしい。季節はちゃんと進んでる。</span>
        <span class="use">下書きに ›</span>
      </button>
      <button class="example" type="button" data-text="春の終わりって、いつも突然。もう半袖でいい気温になってた。">
        <span class="n">3</span>
        <span>春の終わりって、いつも突然。もう半袖でいい気温になってた。</span>
        <span class="use">下書きに ›</span>
      </button>
    </div>

    <!-- 投稿入力 -->
    <p class="section-label">あなたの言葉</p>
    <div class="field">
      <textarea class="textarea" data-count="140" maxlength="180"
        placeholder="今の自分なら、どう返しますか？"></textarea>
      <div class="count">
        <span class="hint">1日1投稿・140字以内</span>
        <span><b>0</b> / 140</span>
      </div>
    </div>

    <button class="btn btn-primary" data-submit disabled>この言葉で返す</button>
    <p class="center muted" style="font-size:12px;">投稿すると、みんなの一覧に並びます。</p>

    <div class="spacer"></div>

  </main>

  <nav class="bottomnav">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      お題
    </a>
    <a class="nav-item" href="posts.html">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg>
      みんな
    </a>
    <a class="nav-item" href="ranking.html">
      <svg viewBox="0 0 24 24"><path d="M6 20v-6M12 20V8M18 20v-9M4 20h16"/></svg>
      ランキング
    </a>
    <a class="nav-item" href="mypage.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      マイページ
    </a>
  </nav>

</div>
<script src="assets/app.js"></script>
</body>
</html>
